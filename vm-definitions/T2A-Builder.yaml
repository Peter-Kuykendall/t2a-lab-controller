name: T2A-Builder

purpose:
  - golden-image-build
  - configuration-validation

hardware:
  cpu:
    cores: 2
  memory:
    mb: 4096

storage:
  disks:
    - name: system
      pool: default
      format: qcow2
      thin: true
      discard: unmap
      virtual_size_gb: 30

network:
  libvirt_network: default

installation:
  media:
    pool: iso
    volume: linuxmint-22.3-mate-64bit.iso
    sha256: 7609294da613b75eea89bb918292125e9f06418a368136fb190466e15bf8c373
  boot_order:
    - cdrom
    - hd

