name: T2A-Builder

purpose:
  - golden-image-build
  - configuration-validation

hardware:
  cpu:
    cores: 2
  memory:
    mb: 4096

storage:
  disks:
    - name: system
      pool: default
      format: qcow2
      thin: true
      discard: unmap
      virtual_size_gb: 30

network:
  libvirt_network: default
