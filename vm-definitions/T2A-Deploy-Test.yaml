name: T2A-Deploy-Test

purpose:
  - deployment-validation
  - restore-regression
  - snapshot-rollback-testing

hardware:
  cpu:
    cores: 2
  memory:
    mb: 4096

storage:
  disks:
    - name: system
      pool: default
      format: qcow2
      thin: true
      discard: unmap
      virtual_size_gb: 30

network:
  libvirt_network: default
